name: finanzas-personales

services:
  api:
    image: finanzas-personales-api:local
    build:
      context: .
      dockerfile: FinanzasPersonales.Api/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__ApplyMigrations: "true"
      ConnectionStrings__DefaultConnection: 'Host=postgres;Port=5432;Database=finanzas_personales;Username=${POSTGRES_USER:?Configure POSTGRES_USER en .env};Password=${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD en .env};Include Error Detail=false'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: finanzas_personales
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD en .env}
    volumes:
      # PostgreSQL 18 utiliza un PGDATA versionado dentro de /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
